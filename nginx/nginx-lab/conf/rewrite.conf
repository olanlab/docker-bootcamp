events {}

http {

  include mime.types;

  server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    rewrite ^/user/(\w+) /hello/$1 last;
    rewrite ^/hello/olan /images/thumb.png;

    location /hello {
      return 200 "Hello";
    }

    location = /hello/olan {
      return 200 "Hello Olan";
    }

  }
}
