user www-data;

events {}

http {

  include mime.types;

  gzip on;
  gzip_comp_level 3;
  
  gzip_types text/css;
  gzip_types text/javascripts;


  server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    

    location ~* \.(css|js|jpg|png)$ {
      add_header Cache-Control public;
      add_header Pragma public;
      add_header Vary Accept-Encoding;
      expires 1M;
    }

  }
}
