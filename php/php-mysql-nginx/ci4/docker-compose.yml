services:
    web:
        image: nginx
        ports:
            - "8080:80"
        volumes: 
            - ./php/site:/site/demo
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - php_network
    php:
        build:
            context: ./php
        volumes:
            - ./php/site:/site/demo
        networks:
            - php_network    
    phpmyadmin:
        depends_on:
            - db
        image: phpmyadmin
        restart: always
        ports:
            - "8888:80"
        networks:
            - php_network
    db:
        image: mysql:8.0
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        env_file:
            - .env
        networks:
            - php_network

networks: 
  php_network: