version: "3"

services:
    web:
        image: nginx
        ports:
            - "8080:80"
        volumes: 
            - ./site:/site/demo
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    php:
        build:
            context: ./php
        volumes:
            - ./site:/site/demo
            
    database:
        image: mysql:5.7
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        # env_file:
        #    - ./.env