version: '3'

services:
  db:
    image: mysql:5.7
    networks:
      - api-application
    volumes:
      - ./db/:/docker-entrypoint-initdb.d
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1111
   env_file:
     - env_file.env
  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin/phpmyadmin
    networks:
      - api-application
    restart: always
    ports:
      - 8888:80
  api:
    build:
      dockerfile: Dockerfile
      context: ./api
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks: 
      - api-application

networks: 
  api-application: