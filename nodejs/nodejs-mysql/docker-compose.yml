services: 
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - 33306:3306
    env_file: ./db/.env
    networks:
      - api_network
  pma: 
    image: phpmyadmin
    environment:
      - PMA_ARBITRARY=1
    networks:
      - api_network
    ports:
      - 8888:80
    depends_on:
      - db
  server:
    restart: always
    build:
      dockerfile: Dockerfile
      context: ./server
    environment:
      - DATABASE_HOST=db
    depends_on:
      - db
    ports:
      - 8080:8080
    networks:
      - api_network
  
volumes:
  db_data:
networks:
  api_network: